<section class="box content-wrapper">
    <div class="content-body" style="padding-top: 10px;">
        <form name="form" #f="ngForm">
            <div class="row">
                <div class="col-xl-6 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="form-group ">
                        <label class="form-label">Tên chức danh
                            <span class='text-danger text-strong'>&nbsp;*</span>
                        </label>
                        <div class="controls">
                            <input type="text" class="form-control" [(ngModel)]="model.tenChucDanh" name="tenPhongBan"
                                required [disabled]="this.isView">
                        </div>
                    </div>
                </div>
                <div class="col-xl-6 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="form-group ">
                        <label class="form-label">Tên đơn vị <span class='text-danger text-strong'>&nbsp;*</span>
                        </label>
                        <div class="controls">
                            <ng-select [items]="lstDonVi" bindLabel="name" bindValue="id" [(ngModel)]="model.idDonVi"
                                name="tendonvi" (change)="getPhongBan()" required [readonly]="this.isView"></ng-select>
                        </div>
                    </div>
                </div>
                <div class="col-xl-6 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="form-group ">
                        <label class="form-label">Tên phòng ban <span class='text-danger text-strong'>&nbsp;*</span>
                        </label>
                        <div class="controls">
                            <ng-select [items]="lstPhongBan" bindLabel="name" bindValue="id"
                                [(ngModel)]="model.idPhongBan" name="tenphongban" required
                                [readonly]="this.isView"></ng-select>
                        </div>
                    </div>
                </div>
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="form-group">
                        <label class="form-label">Lương cơ bản<span
                                class='text-danger text-strong'>&nbsp;*</span></label>
                        <div class="controls">
                            <input type="text" class="form-control" [(ngModel)]="soTien" name="soTien"
                                (input)="formatMoney($event)" required [readonly]="this.isView"
                                oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');">
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-danger" (click)="closeModal(false)">
            <i class="fa fa-power-off"></i> &nbsp;
            <span>
                {{'SharedLabel.Close' | translate}}
            </span>
        </button>
    </div>
</section>
