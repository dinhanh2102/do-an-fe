<div class="modal-header">
    <h4 class="modal-title text-uppercase">{{modalInfo.Title}}</h4>
    <a href="javascript:void(0)" class="close_modal" type="button" class="close" aria-label="Close"
        (click)="closeModal(false)">
        <span aria-hidden="true">&times;</span>
    </a>
</div>
<div class="modal-body padding-15">
    <form name="form" #f="ngForm">
        <div class="row">
            <div class="col-xl-12 col-lg-6 col-md-6 col-sm-12 col-xs-12">
                <div class="form-group ">
                    <label class="form-label">{{'Mã kỳ công' | translate}}
                        <span class='text-danger text-strong'>&nbsp;*</span>
                    </label>
                    <div class="controls">
                        <input type="text" class="form-control" [(ngModel)]="model.maKyCong" name="maKyCong"
                            maxlength="150" required>
                    </div>
                </div>
            </div>
            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-xs-12">
                <div class="form-group ">
                    <label class="form-label">{{'Tháng' | translate}}
                        <span class='text-danger text-strong'>&nbsp;*</span>
                    </label>
                    <div class="controls">
                        <ng-select [items]="constant.DanhSachThang" bindLabel="Name" bindValue="Id" [searchable]="true"
                            [clearable]="true" name="thang" [(ngModel)]="model.thang">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-xs-12">
                <div class="form-group ">
                    <label class="form-label">{{'Năm' | translate}}
                        <span class='text-danger text-strong'>&nbsp;*</span>
                    </label>
                    <div class="controls">
                        <ng-select [items]="years" bindLabel="Name" bindValue="Id" [searchable]="true"
                            [clearable]="true" name="nam" [(ngModel)]="model.nam">
                        </ng-select>
                    </div>
                </div>
            </div>

            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="form-group ">
                    <label class="form-label">{{'Ngày tính công' | translate}}<span
                        class='text-danger text-strong'>&nbsp;*</span>
                    </label>
                    <div class="input-group">
                        <input class="form-control input-date" placeholder="dd/mm/yyyy" (click)="NgayTinhCong.toggle()"
                            name="NgayTinhCong" [(ngModel)]="model.ngayTinhCong" ngbDatepicker required
                            #NgayTinhCong="ngbDatepicker" [minDate]="{ year: 1900, month: 1, day: 1 }">
                        <div class="input-icon">
                            <span class="dtp-icon" (click)="NgayTinhCong.toggle()" name="NgayTinhCong"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="modal-footer">
    <ng-container>
        <button type="button" *appUipermission="['F0111','F0112']" class="btn btn-success" [disabled]="!f.form.valid"
            (click)="save(false)">
            <i class="fa fa-save"></i>&nbsp;
            <span>{{'Lưu' | translate}}</span>
        </button>
    </ng-container>
    <ng-container *ngIf="!id">
        <button type="button" *appUipermission="['F0111']" class="btn btn-success" [disabled]="!f.form.valid"
            (click)="saveAndContinue()">
            <i class="fa fa-save"></i>&nbsp;
            <span>{{'Lưu và tiếp tục' | translate}}</span>
        </button>
    </ng-container>
    <button type="button" class="btn btn-danger" (click)="closeModal(false)">
        <i class="fa fa-power-off"></i> &nbsp;
        <span>
            {{'Đóng' | translate}}
        </span>
    </button>
</div>
