<div class='content-wrapper'>
  <section class="box">
    <div class="content-body" style="height: calc(100vh - 200px)">
      <form name="form" class="tab-form-demo" #f="ngForm" autocomplete="off">
        <div class="row">
          <header>
            <h2 class="title">Thêm mới dữ liệu gương mặt</h2>
          </header>
          <div class="col-lg-3">
            <div class="form-group">
              <label for="name">Tên</label>
              <input type="text" class="form-control" name="name" [(ngModel)]="model.tenNhanVien" disabled />
            </div>
          </div>
          <div class="col-lg-3">
            <div class="form-group">
              <label for="name">Mã</label>
              <input type="text" class="form-control" name="maNhanVien" [(ngModel)]="model.maNhanVien" disabled />
            </div>
          </div>
         
          
        </div>
        <div class="row">
          <div class="col-lg-6">
            <div class="input-group mb-3">
              <div class="input-group-prepend">
                <span class="input-group-text" id="inputGroupFileAddon01">Tải lên</span>
              </div>
              <div class="custom-file">
                <img [src]="url" *ngIf="format==='image' && url" height="500"> <br />
                <!-- <video [src]="url" *ngIf="format==='video' && url" height="500" controls></video> <br /> -->
                <input type="file" class="custom-file-input" id="inputGroupFile01"
                  aria-describedby="inputGroupFileAddon01" (change)="onSelectFile($event)" accept="video/*">
                <label class="custom-file-label" for="inputGroupFile01">{{ selectedFileName || 'Chọn file' }}</label>
                

              </div>
              <button *ngIf="selectedFileName" type="button" class="btn btn-danger" (click)="clearFile()">Clear</button>
            </div>
            <div>
              <!-- <img [src]="url" *ngIf="format==='image' && url" height="500"> <br />
              <video [src]="url" *ngIf="format==='video' && url" height="500" controls></video> <br />
              <input type='file' (change)="onSelectFile($event)" /> -->
            </div>
          </div>
          <div class="col-lg-12" style="text-align: center;">
            <video [src]="url" *ngIf="format==='video' && url" height="500" controls></video> <br />
          </div>
        </div>
      </form>
    </div>
    <div class="content-body text-right">
      <button type="button" class="btn btn-success" (click)="save(false)">
        <i class=" fa fa-save"></i>&nbsp;
        <span>{{'Lưu' | translate}}</span>
      </button>
      <button type="button" class="btn btn-danger" (click)="closeModal(false)">
        <i class="fa fa-power-off"></i> &nbsp;
        <span>
          {{'Đóng' | translate}}
        </span>
      </button>
    </div>
  </section>
</div>
