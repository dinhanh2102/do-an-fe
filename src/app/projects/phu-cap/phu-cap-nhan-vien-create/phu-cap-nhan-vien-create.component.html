<div class="modal-header">
    <h4 class="modal-title text-uppercase">{{modalInfo.Title}}</h4>
    <a href="javascript:void(0)" class="close_modal" type="button" class="close" aria-label="Close"
        (click)="closeModal(false)">
        <span aria-hidden="true">&times;</span>
    </a>
</div>
<div class="modal-body padding-15">
    <form name="form" #f="ngForm">
        <div class="row">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="form-group ">
                    <label class="form-label">Nhân viên<span class='text-danger text-strong'>&nbsp;*</span>
                    </label>
                    <div class="controls">
                        <ng-select [items]="lstNhanVien" bindLabel="name" bindValue="id" [(ngModel)]="model.idNhanVien"
                            name="idNhanVien" required></ng-select>
                    </div>
                </div>
            </div>
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="form-group ">
                    <label class="form-label">Loại phụ cấp
                        <span class='text-danger text-strong'>&nbsp;*</span>
                    </label>
                    <div class="controls">
                        <ng-select [items]="lstPhuCap" bindLabel="name" bindValue="id" [(ngModel)]="model.idPhuCap"
                            name="idPhuCap" required></ng-select>
                    </div>
                </div>
            </div>
            <!-- <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="form-group ">
                    <label class="form-label">Số tiền <span class='text-danger text-strong'>&nbsp;</span>
                    </label>
                    <div class="controls">
                        <input class="form-control" [(ngModel)]="soTien" type="text"
                            oninput="this.value = this.value.replace(/[^0-9.]/g, '').substring(0, 160);"
                            (input)="formatNumber()" [value]="soTien" name="soTien" required>
                    </div>
                </div>
            </div> -->
        </div>
        <div class="row">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="form-group">
                    <label class="form-label">Nội dung</label>
                    <div class="controls">
                        <textarea class="form-control" [(ngModel)]="model.noiDung" name="noiDung" cols="30"
                            rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<div class="modal-footer">
    <ng-container>
        <button type="button" class="btn btn-success" [disabled]="!f.form.valid" (click)="save(false)">
            <i class="fa fa-save"></i>&nbsp;
            <span>{{'Lưu' | translate}}</span>
        </button>
    </ng-container>
    <ng-container *ngIf="!id">
        <button type="button" class="btn btn-success" [disabled]="!f.form.valid" (click)="save(true)">
            <i class="fa fa-save"></i>&nbsp;
            <span>{{'Lưu và tiếp tục' | translate}}</span>
        </button>
    </ng-container>
    <button type="button" class="btn btn-danger" (click)="closeModal(false)">
        <i class="fa fa-power-off"></i> &nbsp;
        <span>
            {{'Đóng' | translate}}
        </span>
    </button>
</div>
